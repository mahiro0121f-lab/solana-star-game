<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solana Star Catcher</title>
<style>
  :root {
    --purple: #9945FF;
    --green: #14F195;
    --bg: #120a24;
    --bg2: #1d1038;
    --text: #f4efff;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Trebuchet MS", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 12px;
    background: linear-gradient(135deg, var(--purple), #6a2fc4);
    border-bottom: 3px solid var(--green);
    text-align: center;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.3rem, 5vw, 2rem);
    letter-spacing: .04em;
    color: #fff;
  }
  h1 span { color: var(--green); }
  .stats { display: flex; justify-content: center; gap: 12px; }
  .stat {
    min-width: 110px; padding: 6px 14px;
    background: rgba(18,10,36,.55);
    border: 2px solid var(--green);
    border-radius: 12px;
  }
  .stat small { display: block; font-size: .75rem; opacity: .85; }
  .stat b { font-size: 1.5rem; color: var(--green); font-variant-numeric: tabular-nums; }
  .stat.low b { color: #ff6b8a; }
  #field {
    position: relative; flex: 1; overflow: hidden;
    background: radial-gradient(ellipse at 50% 100%, var(--bg2), var(--bg) 70%);
    touch-action: manipulation;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .star {
    position: absolute; top: 0; left: 0;
    width: 56px; height: 56px;
    margin: -28px 0 0 -28px;
    cursor: pointer;
    will-change: transform;
  }
  .star svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 8px currentColor); }
  .star.green { color: var(--green); }
  .star.purple { color: var(--purple); }
  .pop {
    position: absolute; pointer-events: none;
    font-weight: bold; color: var(--green);
    animation: pop .6s ease-out forwards;
  }
  @keyframes pop {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-40px); }
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
    background: rgba(18,10,36,.82);
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay p { margin: 0; line-height: 1.6; max-width: 28em; }
  .big { font-size: 3rem; color: var(--green); font-weight: bold; }
  button {
    font: inherit; font-size: 1.2rem; font-weight: bold;
    padding: 12px 36px; border: 0; border-radius: 999px;
    background: var(--green); color: #1a0b33; cursor: pointer;
    box-shadow: 0 4px 0 #0a9c60;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a9c60; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .pop { animation-duration: .01s; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Solana <span>Star</span> Catcher</h1>
    <div class="stats">
      <div class="stat"><small>スコア</small><b id="score">0</b></div>
      <div class="stat" id="timeBox"><small>残り時間</small><b id="time">30</b></div>
    </div>
  </header>

  <div id="field">
    <div class="overlay" id="startScreen">
      <p>落ちてくる星をタップ／クリックして集めよう。<br>制限時間は30秒。<br>緑の星は 1 点、紫の星は 3 点（小さくて速い）。</p>
      <button id="startBtn">スタート</button>
    </div>
    <div class="overlay hidden" id="endScreen">
      <div>時間切れ！</div>
      <div class="big" id="finalScore">0</div>
      <p id="bestText"></p>
      <button id="retryBtn">もう一度</button>
    </div>
  </div>
</div>

<script>
(() => {
  const field = document.getElementById('field');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const timeBox = document.getElementById('timeBox');
  const startScreen = document.getElementById('startScreen');
  const endScreen = document.getElementById('endScreen');
  const finalScore = document.getElementById('finalScore');
  const bestText = document.getElementById('bestText');

  const GAME_SECONDS = 30;
  const STAR_SVG = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5l3 7 7.5.7-5.7 5 1.8 7.3L12 17.6 5.4 21.5l1.8-7.3-5.7-5L9 8.5z"/></svg>';

  let stars = [];
  let score = 0;
  let running = false;
  let endAt = 0;
  let lastFrame = 0;
  let spawnTimer = 0;
  let best = 0;

  function spawn() {
    const purple = Math.random() < 0.2;
    const size = purple ? 40 : 56;
    const el = document.createElement('div');
    el.className = 'star ' + (purple ? 'purple' : 'green');
    el.style.width = el.style.height = size + 'px';
    el.style.margin = (-size / 2) + 'px 0 0 ' + (-size / 2) + 'px';
    el.innerHTML = STAR_SVG;

    const w = field.clientWidth;
    const s = {
      el, size,
      points: purple ? 3 : 1,
      x: size + Math.random() * Math.max(1, w - size * 2),
      y: -size,
      vy: (purple ? 260 : 150) + Math.random() * 90,
      rot: Math.random() * 360,
      vr: (Math.random() - .5) * 240
    };
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!running || s.dead) return;
      catchStar(s, e);
    });
    field.appendChild(el);
    stars.push(s);
  }

  function catchStar(s, e) {
    s.dead = true;
    score += s.points;
    scoreEl.textContent = score;
    const r = field.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.textContent = '+' + s.points;
    pop.style.left = (e.clientX - r.left - 10) + 'px';
    pop.style.top = (e.clientY - r.top - 20) + 'px';
    field.appendChild(pop);
    setTimeout(() => pop.remove(), 650);
    s.el.remove();
  }

  function frame(now) {
    if (!running) return;
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    const left = Math.max(0, (endAt - now) / 1000);
    timeEl.textContent = Math.ceil(left);
    timeBox.classList.toggle('low', left <= 5);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawn();
      const progress = 1 - left / GAME_SECONDS;
      spawnTimer = 0.7 - progress * 0.35 + Math.random() * 0.2;
    }

    const h = field.clientHeight;
    for (const s of stars) {
      if (s.dead) continue;
      s.y += s.vy * dt;
      s.rot += s.vr * dt;
      s.el.style.transform = 'translate(' + s.x + 'px,' + s.y + 'px) rotate(' + s.rot + 'deg)';
      if (s.y > h + s.size) { s.dead = true; s.el.remove(); }
    }
    stars = stars.filter(s => !s.dead);

    if (left <= 0) return endGame();
    requestAnimationFrame(frame);
  }

  function startGame() {
    stars.forEach(s => s.el.remove());
    stars = [];
    score = 0;
    scoreEl.textContent = '0';
    timeEl.textContent = GAME_SECONDS;
    timeBox.classList.remove('low');
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    running = true;
    spawnTimer = 0;
    lastFrame = performance.now();
    endAt = lastFrame + GAME_SECONDS * 1000;
    requestAnimationFrame(frame);
  }

  function endGame() {
    running = false;
    timeEl.textContent = '0';
    stars.forEach(s => s.el.remove());
    stars = [];
    const isNew = score > best;
    if (isNew) best = score;
    finalScore.textContent = score;
    bestText.textContent = isNew && score > 0 ? 'ベストスコアを更新しました！' : 'このページでのベスト: ' + best;
    endScreen.classList.remove('hidden');
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
})();
</script>
</body>
</html>
